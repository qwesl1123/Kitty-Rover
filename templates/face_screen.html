<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rover Face Screen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    #faceVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      opacity: 0;
      transition: opacity 120ms ease-in-out;
    }
    body.video-active #faceVideo { opacity: 1; }
    body.video-active .wrap { opacity: 0; pointer-events: none; }
    .wrap { max-width: 900px; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      color: #c7c7c7;
    }
    .status {
      margin-top: 1.25rem;
      font-size: clamp(0.9rem, 1.6vw, 1.1rem);
      color: #9c9c9c;
    }
    .message {
      margin-top: 2rem;
      min-height: 3.5rem;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <video id="faceVideo" autoplay muted playsinline></video>
  <main class="wrap" role="main" aria-live="polite">
    <h1>Waiting for face video...</h1>
    <p class="sub">Rover Face Screen Ready</p>
    <p id="faceScreenConnectionStatus" class="status">Connecting to rover server...</p>
    <p id="faceScreenMessage" class="message"></p>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const statusEl = document.getElementById("faceScreenConnectionStatus");
    const messageEl = document.getElementById("faceScreenMessage");
    const faceVideo = document.getElementById("faceVideo");
    const socket = typeof io === "function" ? io() : null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
    let faceVideoPc = null;
    let remoteStream = null;
    let remoteIceQueue = [];

    function setStatus(text) {
      statusEl.textContent = text;
    }

    if (!socket) {
      setStatus("Disconnected");
    } else {
      function showWaiting(statusText = "Waiting for controller...") {
        document.body.classList.remove("video-active");
        setStatus(statusText);
      }

      function showVideo() {
        document.body.classList.add("video-active");
        setStatus("Face video active");
      }

      function waitForIceGatheringComplete(pc) {
        if (pc.iceGatheringState === "complete") {
          return Promise.resolve();
        }

        return new Promise((resolve) => {
          const timeout = setTimeout(() => {
            pc.removeEventListener("icegatheringstatechange", onStateChange);
            resolve();
          }, 3000);

          const onStateChange = () => {
            if (pc.iceGatheringState === "complete") {
              clearTimeout(timeout);
              pc.removeEventListener("icegatheringstatechange", onStateChange);
              resolve();
            }
          };
          pc.addEventListener("icegatheringstatechange", onStateChange);
        });
      }

      function cleanupFaceVideo(statusText = "Waiting for controller...") {
        if (faceVideoPc) {
          faceVideoPc.ontrack = null;
          faceVideoPc.onicecandidate = null;
          faceVideoPc.close();
        }
        faceVideoPc = null;
        remoteStream = null;
        faceVideo.pause();
        faceVideo.srcObject = null;
        showWaiting(statusText);
      }

      async function prepareFaceVideoPeer() {
        if (faceVideoPc) {
          cleanupFaceVideo("Restarting face video...");
        }

        faceVideoPc = new RTCPeerConnection(rtcConfig);
        remoteIceQueue = [];
        remoteStream = new MediaStream();
        faceVideo.srcObject = remoteStream;

        faceVideoPc.ontrack = (event) => {
          setStatus("Face video remote track received");
          event.streams[0]?.getTracks().forEach((track) => remoteStream.addTrack(track));
          if (!event.streams[0]) {
            remoteStream.addTrack(event.track);
          }
          faceVideo.play().catch((err) => {
            showWaiting("Face video play error: " + err.message);
          });
        };

        faceVideoPc.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("face_video_ice", { candidate: event.candidate, target: "controller" });
          }
        };

        faceVideoPc.onconnectionstatechange = () => {
          if (!faceVideoPc) return;
          setStatus("Face video connectionState: " + faceVideoPc.connectionState);
        };

        faceVideoPc.oniceconnectionstatechange = () => {
          if (!faceVideoPc) return;
          setStatus("Face video iceConnectionState: " + faceVideoPc.iceConnectionState);
        };
      }

      faceVideo.addEventListener("loadeddata", () => {
        setStatus("Face video loadeddata");
        showVideo();
      });

      faceVideo.addEventListener("playing", () => {
        setStatus("Face video starts playing");
        showVideo();
      });

      socket.on("connect", () => {
        setStatus("Connected to rover server · Waiting for controller...");
        socket.emit("face_screen_join");
      });

      socket.on("disconnect", () => {
        cleanupFaceVideo("Disconnected");
      });

      socket.on("face_screen_display_message", (payload) => {
        const message = payload && payload.message ? String(payload.message) : "";
        if (message) {
          messageEl.textContent = message;
          setStatus("Controller message received");
        }
      });

      socket.on("face_video_offer", async (offer) => {
        if (!offer || offer.type !== "offer" || !offer.sdp) {
          return;
        }

        try {
          setStatus("Face video offer received");
          await prepareFaceVideoPeer();
          await faceVideoPc.setRemoteDescription(new RTCSessionDescription(offer));
          while (remoteIceQueue.length > 0) {
            await faceVideoPc.addIceCandidate(remoteIceQueue.shift());
          }
          const answer = await faceVideoPc.createAnswer();
          await faceVideoPc.setLocalDescription(answer);
          await waitForIceGatheringComplete(faceVideoPc);
          socket.emit("face_video_answer", faceVideoPc.localDescription);
          setStatus("Face video answer sent");
        } catch (err) {
          cleanupFaceVideo("Face video error: " + err.message);
        }
      });

      socket.on("face_video_ice", async (payload) => {
        if (!faceVideoPc || !payload || !payload.candidate) {
          return;
        }
        try {
          if (!faceVideoPc.remoteDescription) {
            remoteIceQueue.push(payload.candidate);
            setStatus("Face video ICE queued (waiting for remote description)");
            return;
          }
          await faceVideoPc.addIceCandidate(payload.candidate);
        } catch (err) {
          setStatus("ICE error: " + err.message);
        }
      });

      socket.on("face_video_stop", () => {
        cleanupFaceVideo("Waiting for controller...");
      });

      const leaveFaceScreen = () => {
        cleanupFaceVideo("Leaving page...");
        if (socket.connected) {
          socket.emit("face_screen_leave");
        }
      };

      window.addEventListener("pagehide", leaveFaceScreen);
      window.addEventListener("beforeunload", leaveFaceScreen);
    }
  </script>
</body>
</html>
