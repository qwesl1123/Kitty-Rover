<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rover Face Screen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #f4f4f4;
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    body {
      position: relative;
      padding: 2.5rem 2.5rem;
      overflow: hidden;
    }
    #faceVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      opacity: 0;
      transition: opacity 120ms ease-in-out;
    }
    body.video-active #faceVideo { opacity: 1; }
    body.video-active .wrap { opacity: 0; pointer-events: none; }
    body.video-active #catSprite { opacity: 0; }

    /* Transparent cat sprite — top-left, alongside the CLI text.
       Hidden when the rover face video takes over the screen. */
    #catSprite {
      position: fixed;
      top: 1.5rem;
      left: clamp(18rem, 28vw, 26rem);
      width: clamp(80px, 9vw, 140px);
      height: clamp(80px, 9vw, 140px);
      pointer-events: none;
      z-index: 5;
      opacity: 1;
      transition: opacity 120ms ease-in-out;
    }

    /* CLI terminal aesthetic — top-left, green phosphor, monospace.
       Larger than real terminal text so it reads from across the room. */
    .wrap {
      position: relative;
      max-width: none;
      text-align: left;
      color: #33ff33;
      font-size: clamp(1.6rem, 3.2vw, 2.2rem);
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-shadow: 0 0 8px rgba(51, 255, 51, 0.35);
      transition: opacity 120ms ease-in-out;
    }
    .wrap > * {
      margin: 0;
      padding: 0;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      letter-spacing: inherit;
    }

    /* Status line gets the blinking cursor (bulletproof: visibility + step-end,
       same pattern that survives iOS Low Power Mode throttling). */
    #faceScreenConnectionStatus::after {
      content: "_";
      display: inline-block;
      margin-left: 0.15em;
      animation: cliCursorBlink 1.06s step-end infinite;
    }

    @keyframes cliCursorBlink {
      from, 49.9% { visibility: visible; }
      50%, to     { visibility: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      #faceScreenConnectionStatus::after {
        animation: none;
        visibility: visible;
      }
    }
  </style>
</head>
<body>
  <video id="faceVideo" autoplay muted playsinline></video>
  <video id="catSprite" src="/static/oiia_cat.webm" autoplay loop muted playsinline></video>
  <main class="wrap" role="main" aria-live="polite">
    <h1>Waiting for phone camera...</h1>
    <p>Rover Face Screen Ready</p>
    <p id="faceScreenConnectionStatus">Connecting to rover server</p>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const statusEl = document.getElementById("faceScreenConnectionStatus");
    const faceVideo = document.getElementById("faceVideo");
    const socket = typeof io === "function" ? io() : null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    let relayViewerPc = null;
    let relayViewerId = null;
    let relayViewerRetryTimer = null;
    let relayViewerConnecting = false;

    function setStatus(text) {
      // Strip trailing dots so the blinking cursor doesn't read as "..._".
      statusEl.textContent = String(text).replace(/\.+$/, "");
    }

    if (!socket) {
      setStatus("Disconnected");
    } else {
      function showWaiting(statusText = "Waiting for phone camera...") {
        document.body.classList.remove("video-active");
        setStatus(statusText);
      }

      function showVideo() {
        document.body.classList.add("video-active");
        setStatus("Video playing");
      }

      function waitForIceGatheringComplete(pc) {
        if (pc.iceGatheringState === "complete") {
          return Promise.resolve();
        }

        return new Promise((resolve) => {
          const timeout = setTimeout(() => {
            pc.removeEventListener("icegatheringstatechange", onStateChange);
            resolve();
          }, 3000);

          const onStateChange = () => {
            if (pc.iceGatheringState === "complete") {
              clearTimeout(timeout);
              pc.removeEventListener("icegatheringstatechange", onStateChange);
              resolve();
            }
          };
          pc.addEventListener("icegatheringstatechange", onStateChange);
        });
      }

      function clearRelayRetryTimer() {
        if (relayViewerRetryTimer) {
          clearTimeout(relayViewerRetryTimer);
          relayViewerRetryTimer = null;
        }
      }

      function scheduleRelayViewerRetry(statusText = "Waiting for phone camera...") {
        clearRelayRetryTimer();
        showWaiting(statusText);
        relayViewerRetryTimer = setTimeout(() => {
          startRelayViewer();
        }, 2000);
      }

      async function stopRelayViewer(statusText = "Waiting for phone camera...") {
        clearRelayRetryTimer();
        relayViewerConnecting = false;

        if (relayViewerPc) {
          relayViewerPc.ontrack = null;
          relayViewerPc.oniceconnectionstatechange = null;
          relayViewerPc.onconnectionstatechange = null;
          relayViewerPc.close();
          relayViewerPc = null;
        }

        const closingViewerId = relayViewerId;
        relayViewerId = null;

        faceVideo.pause();
        faceVideo.srcObject = null;
        document.body.classList.remove("video-active");
        showWaiting(statusText);

        if (closingViewerId) {
          try {
            await fetch("/webrtc/face_video/view_close", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ viewer_id: closingViewerId })
            });
          } catch (err) {
            setStatus("Relay viewer close warning: " + err.message);
          }
        }
      }

      async function startRelayViewer() {
        if (!socket.connected || relayViewerConnecting || relayViewerPc) {
          return;
        }

        clearRelayRetryTimer();
        relayViewerConnecting = true;
        showWaiting("Relay viewer connecting...");

        try {
          const pc = new RTCPeerConnection(rtcConfig);
          relayViewerPc = pc;
          let trackReceived = false;

          pc.addTransceiver("video", { direction: "recvonly" });

          pc.ontrack = (event) => {
            trackReceived = true;
            setStatus("Remote track received");
            const stream = event.streams && event.streams[0]
              ? event.streams[0]
              : new MediaStream([event.track]);
            faceVideo.srcObject = stream;

            // Belt-and-suspenders: if the publisher goes away and the
            // server-side socket notification is delayed or missed, the
            // track 'ended' event will usually fire faster than ICE
            // consent-freshness timeout.
            event.track.addEventListener("ended", () => {
              setStatus("Remote track ended");
              stopRelayViewer("Phone camera stopped").finally(() => {
                scheduleRelayViewerRetry("Waiting for phone camera...");
              });
            });

            faceVideo.play().catch((err) => {
              setStatus("Relay viewer failed: " + err.message);
            });
          };

          pc.oniceconnectionstatechange = () => {
            if (!relayViewerPc || relayViewerPc !== pc) return;
            const state = pc.iceConnectionState;
            setStatus("Relay viewer ICE: " + state);
            if (["failed", "disconnected", "closed"].includes(state)) {
              stopRelayViewer("Relay viewer failed: " + state).finally(() => {
                scheduleRelayViewerRetry("Waiting for phone camera...");
              });
            }
          };

          pc.onconnectionstatechange = () => {
            if (!relayViewerPc || relayViewerPc !== pc) return;
            const state = pc.connectionState;
            if (state === "connected") {
              setStatus(trackReceived ? "Remote track received" : "Relay viewer connected");
            } else if (["failed", "disconnected", "closed"].includes(state)) {
              stopRelayViewer("Relay viewer failed: " + state).finally(() => {
                scheduleRelayViewerRetry("Waiting for phone camera...");
              });
            } else {
              setStatus("Relay viewer state: " + state);
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await waitForIceGatheringComplete(pc);

          const response = await fetch("/webrtc/face_video/view_offer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pc.localDescription)
          });

          let payload = {};
          try {
            payload = await response.json();
          } catch (err) {
            payload = {};
          }

          if (!response.ok) {
            relayViewerPc = null;
            pc.close();
            if (response.status === 409 && payload.code === "no_publisher") {
              showWaiting("No phone camera publisher yet");
              scheduleRelayViewerRetry("Waiting for phone camera...");
              return;
            }
            throw new Error(payload.error || ("HTTP " + response.status));
          }

          if (!payload.sdp || !payload.type || !payload.viewer_id) {
            throw new Error("Invalid relay answer payload");
          }

          relayViewerId = payload.viewer_id;
          await pc.setRemoteDescription(new RTCSessionDescription({
            sdp: payload.sdp,
            type: payload.type
          }));
          showWaiting("Connected to face video relay; waiting for frames...");
          setStatus("Relay viewer connected");
        } catch (err) {
          await stopRelayViewer("Relay viewer failed: " + err.message);
          scheduleRelayViewerRetry("Waiting for phone camera...");
        } finally {
          relayViewerConnecting = false;
        }
      }

      faceVideo.addEventListener("loadeddata", () => {
        setStatus("Face video loadeddata");
        showVideo();
      });

      faceVideo.addEventListener("playing", () => {
        setStatus("Face video starts playing");
        showVideo();
      });

      socket.on("connect", () => {
        setStatus("Connected to rover server · Waiting for phone camera...");
        socket.emit("face_screen_join");
        startRelayViewer();
      });

      socket.on("disconnect", () => {
        stopRelayViewer("Disconnected");
      });

      // Server-pushed notification: publisher (phone) went away. Tear down
      // the relay viewer immediately instead of waiting 10-30s for the
      // WebRTC stack to notice via ICE consent-freshness timeout.
      socket.on("face_video_publisher_offline", () => {
        stopRelayViewer("Phone camera stopped").finally(() => {
          scheduleRelayViewerRetry("Waiting for phone camera...");
        });
      });

      const leaveFaceScreen = () => {
        stopRelayViewer("Leaving page...");
        if (socket.connected) {
          socket.emit("face_screen_leave");
        }
      };

      window.addEventListener("pagehide", leaveFaceScreen);
      window.addEventListener("beforeunload", leaveFaceScreen);
    }
  </script>
</body>
</html>
