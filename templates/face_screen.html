<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rover Face Screen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 900px; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      color: #c7c7c7;
    }
    .status {
      margin-top: 1.25rem;
      font-size: clamp(0.9rem, 1.6vw, 1.1rem);
      color: #9c9c9c;
    }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-live="polite">
    <h1>Waiting for face video...</h1>
    <p class="sub">Rover Face Screen Ready</p>
    <p class="status">Keep this screen open. Start face video from controller.</p>
  </main>
</body>
</html>
